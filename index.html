<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LURZ AI — Market signals that guide your next move</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Suppress browser extension noise (e.g., MetaMask, wallet extensions modifying window.fetch)
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message &&
            (event.message.includes('Cannot set property fetch') ||
              event.message.includes('MetaMask') ||
              event.message.includes('ethereum'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          const reason = event.reason && (event.reason.message || String(event.reason));
          if (
            reason &&
            (reason.includes('MetaMask') ||
              reason.includes('Cannot set property fetch') ||
              reason.includes('ethereum'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
